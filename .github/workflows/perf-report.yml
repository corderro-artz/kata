name: Performance Report

on:
  push:
    branches: [main]
    paths-ignore:
      - 'reports/**'
      - 'public/samples/**'
      - '**.md'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  # Needed to dispatch Deploy Pages once new reports land (see the last step).
  actions: write

concurrency:
  group: perf-report
  cancel-in-progress: true

jobs:
  report:
    name: Run Performance Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - run: npm ci

      - name: Run performance report
        run: npm run perf:report
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Commit updated reports
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/performance/ public/samples/
          if git diff --staged --quiet; then
            echo "No report changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: update performance reports"
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto origin/main."
            git pull --rebase origin main
          done
          echo "::error::Could not push performance reports after 3 attempts."
          exit 1

      # No explicit deploy step. The app fetches
      # public/samples/latest-profile.json at runtime, so the refreshed report
      # does have to reach the published site — but Cloudflare Pages builds
      # this repository from the push webhook, and the commit above is enough.
      #
      # This used to dispatch deploy-pages.yml, because a push authenticated
      # with GITHUB_TOKEN deliberately does not start a GitHub Actions run.
      # That restriction is specific to Actions: GitHub still delivers the push
      # webhook to installed GitHub Apps, so Cloudflare sees it. Verified on
      # commit 8f7823d, which this workflow pushed and Cloudflare built
      # unprompted as a github:push deployment.
