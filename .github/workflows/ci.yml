name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a dropped push trigger be re-run without an empty commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

      # The rendered diagrams are generated from docs/diagrams/*.mmd. This fails
      # if an SVG has stopped carrying a word its source declares, if it was
      # rendered without the brand theme, or if it is malformed. It imports only
      # node builtins, so it needs nothing installed.
      - run: node docs/diagrams/check.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
